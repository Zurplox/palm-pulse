name: Build daily palm-oil briefing

on:
  push:
    branches: [main]
    # Only code changes rebuild. Editing docs no longer burns a Gemini run or
    # risks cancelling the scheduled morning build.
    paths:
      - "scripts/**"
      - "config/**"
      - "assets/**"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "requirements.txt"
      - ".github/workflows/daily-news.yml"
  schedule:
    - cron: "30 22 * * *" # 06:30 Singapore/Malaysia, 05:30 WIB
  workflow_dispatch:

permissions:
  contents: write # needed to persist generated data on the data branch
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a run in progress: a push used to be able to kill the daily
  # scheduled briefing halfway through.
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore previously generated data
        # Brings back the real previous edition, the archive and the price
        # history so this run can archive and extend them instead of starting
        # from the committed seed every time.
        run: |
          if git fetch origin data --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- data && echo "Restored data from the data branch."
          else
            echo "No data branch yet; using the committed seed for this first run."
          fi

      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Collect news, InfoSAWIT TBS prices and summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash' }}
          GEMINI_FALLBACK_MODEL_2: ${{ vars.GEMINI_FALLBACK_MODEL_2 || 'gemini-3.1-flash-lite' }}
          MAX_AI_SUMMARIES: "18"
          AI_BATCH_SIZE: ${{ vars.AI_BATCH_SIZE || '6' }}
        run: python scripts/fetch_news.py

      - name: Safety-check generated data
        run: |
          python -m py_compile scripts/fetch_news.py scripts/qa.py
          python scripts/qa.py
          node --check assets/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist generated data to the data branch
        # Runs after deployment so a git failure can never block publishing.
        # main is never modified: no conflicts, and no trigger loops.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/generated-data /tmp/databranch
          cp -r data /tmp/generated-data
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch data "$REMOTE" /tmp/databranch 2>/dev/null \
            || git clone --depth 1 "$REMOTE" /tmp/databranch
          cd /tmp/databranch
          git checkout -B data
          rm -rf data
          cp -r /tmp/generated-data data
          git add -A data
          git -c user.name="palm-pulse-bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data: $(date -u +%F) edition" || echo "Nothing new to persist."
          git push origin data
